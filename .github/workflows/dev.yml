name: DEV CI

on:
  push:
    branches:
      - dev

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:dev .

      - run: docker push ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:dev

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true   # ← ignore l'erreur du rm interne
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:security
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
