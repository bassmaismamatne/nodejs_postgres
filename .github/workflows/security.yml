name: Security Scan

on:
  push:
    branches:
      - security

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@v3

     
      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:security .

      
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:security

      
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nodejs_postgres:security
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
